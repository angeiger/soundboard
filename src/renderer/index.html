<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Soundboard</title>
    <!--
      Audio worklets load from blob: URLs, and worklets are governed by
      script-src, not worker-src. With blob: only on worker-src, as before, the
      noise gate was refused and never ran -- silently, until its failure was
      surfaced in Settings.
      'wasm-unsafe-eval' lets RNNoise's WebAssembly compile inside its
      worklet, which inherits this policy. It permits wasm compilation only,
      not JavaScript eval.
      No remote host is allowed anywhere: the fonts are bundled (fonts.css),
      so the page itself never touches the network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; media-src 'self' blob: mediastream:; img-src 'self' data:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
