<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Soundboard</title>
    <!--
      Audio worklets load from blob: URLs, and worklets are governed by
      script-src, not worker-src. With blob: only on worker-src, as before, the
      noise gate was refused and never ran -- silently, until its failure was
      surfaced in Settings.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' blob:; media-src 'self' blob: mediastream:; img-src 'self' data:"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
