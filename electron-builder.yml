appId: com.andreas.soundboard
productName: Soundboard
directories:
  buildResources: resources
  output: dist
# uiohook-napi is N-API, so its prebuilt binary is ABI-stable across Electron
# versions and must not be rebuilt. Letting @electron/rebuild try also breaks
# outright here, because node-gyp cannot handle the space in "C:\Claude Code".
npmRebuild: false
# Native binaries cannot be loaded from inside an asar archive.
asarUnpack:
  - '**/node_modules/uiohook-napi/**'
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}'
  - '!{tailwind.config.js,postcss.config.js,electron-builder.yml,vitest.config.ts}'
  # Development material that was being shipped inside every installer.
  # build/ holds Vite plugins; what they produce is already in out/.
  - '!{docs,test-sounds,build,.claude}/**'
  - '!{README.md,RELEASE_NOTES.md}'
  - '!*.tsbuildinfo'
# What the installer redistributes as files of its own, rather than compiled
# into the bundle: the two fonts (the OFL asks for its text to travel with
# them) and the RNNoise build (Apache-2.0 likewise). They land in
# resources/licenses beside the app.
extraResources:
  - from: node_modules/@fontsource-variable/inter/LICENSE
    to: licenses/Inter.txt
  - from: node_modules/@fontsource-variable/jetbrains-mono/LICENSE
    to: licenses/JetBrains-Mono.txt
  - from: node_modules/@jitsi/rnnoise-wasm/LICENSE
    to: licenses/rnnoise-wasm.txt
win:
  target:
    - target: nsis
      arch: [x64]
  # Deliberately version-less. GitHub's /releases/latest/download/<name> link
  # resolves by exact filename, so putting the version in the name breaks that
  # link on every release. electron-updater reads the version from latest.yml,
  # not from the filename.
  artifactName: ${productName}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  shortcutName: Soundboard
# Declared now so every build emits latest.yml alongside the installer. Nothing
# is uploaded without an explicit --publish, but electron-updater needs that
# file to exist in the release, and adding it retroactively means re-cutting
# every release made before it.
publish:
  provider: github
  owner: angeiger
  repo: soundboard
